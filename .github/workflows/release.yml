# PureVox 打包 / 发版 —— **多平台**：Windows（NSIS 安装包）、Linux（deb+rpm+AppImage）、
# Android（签名 release APK）。触发：推 tag `v*`（构建 + 建 release）或手动 `workflow_dispatch`
# （只构建、不建 release）。**分支推送不触发**；代码门禁见 tests.yml（手动）。
# 缓存：sccache 自动写（对象级、按源码/编译器指纹复用）；每次发版再自动 save
# cargo registry / cargo-tauri（同键已存在则跳过）。不再需要手动 warm-cache。
# 版本/键唯一来源
# tools/automation/versions.env；门禁实现唯一 = tools/automation/check.py。
# 注意 AGENTS.md 维护准则：CI 失败、从未生成 release 的 tag 必须删除
# （git tag -d <tag> && git push origin :refs/tags/<tag>），否则会截断下个 tag 的提交记录。
name: 打包发版（tag v* / 手动）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # linuxdeploy / appimagetool 需要 FUSE；CI 容器里没有，用解包运行模式。
  APPIMAGE_EXTRACT_AND_RUN: "1"
  # 脚本大量打中文，Windows runner 的 Python 默认按控制台代码页（cp1252）输出，
  # 会 UnicodeEncodeError。双保险：脚本内部自己也 reconfigure（tools/automation/_utf8.py）。
  PYTHONIOENCODING: utf-8

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: 打包 · Windows（NSIS 安装包）
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # 全部 bash（原来整份用 pwsh，见 tests.yml 同处注释）。Windows runner 上 bash 由 Git 自带。
      - name: Set app version（tag / 日期）
        shell: bash
        run: python tools/automation/version.py >> "$GITHUB_ENV"

      - name: Load versions + cache keys (versions.env 是唯一来源)
        shell: bash
        run: |
          # **必须 source，不能只写 GITHUB_ENV**：写进 GITHUB_ENV 的变量要到**后续 step**
          # 才注入进程环境，而缓存键就在这一步里拼 —— 只写不 source 的话 $CACHE_GEN / $TCLI_VER
          # 全是空串，拼出来的键是残的（曾因此让 tauri-cli 那步直接失败）。理由见 tests.yml。
          set -a
          . tools/automation/versions.env
          set +a
          # 再写进 GITHUB_ENV，供后续 step 使用
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
            esac
          done < tools/automation/versions.env
          lock="${{ hashFiles('src-tauri/Cargo.lock') }}"
          # 发行版标记来自 versions.env 的 LINUX_CACHE_TAG（runs-on 写死，静态已知）。理由见 tests.yml。
          case "$RUNNER_OS" in
            Windows) os_tag="windows" ;;
            *)       os_tag="$LINUX_CACHE_TAG" ;;
          esac
          {
            printf 'CARGO_CACHE_KEY=purevox-%s-%s-cargo-%s-%s\n' "$RUNNER_OS" "$os_tag" "$CACHE_GEN" "$lock"
            printf 'TAURI_CLI_KEY=purevox-%s-tauri-cli-%s\n' "$RUNNER_OS" "$TCLI_VER"
          } >> "$GITHUB_ENV"
          echo "CARGO_CACHE_KEY=$CARGO_CACHE_KEY"

      - name: sccache（编译器对象缓存，自动更新）
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Rust toolchain (rustfmt + clippy)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      # restore 一律不写 restore-keys，理由见 tests.yml 同处注释。
      # release 的编译复用由 sccache 负责；target/release 不做目录缓存（太大）。
      - name: Restore cargo registry (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}


      - name: Restore cargo-tauri binary (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}

      - name: Install tauri-cli（仅在缺失时编译，版本钉死）
        shell: bash
        run: |
          # 判据是「盘上有没有」，不是 cache-hit 输出 —— runner 镜像可能已预装 cargo-tauri，
          # 那时 cache-hit 是 false 但二进制已在，`cargo install` 会撞
          # "binary already exists in destination"。command -v 判断天然幂等。
          # restore-keys 已全部去掉，所以「部分命中」这种情形不再存在。
          if command -v cargo-tauri >/dev/null 2>&1; then
            echo "cargo-tauri 已存在（缓存或镜像预装），跳过安装"
          else
            cargo install tauri-cli --version "$TCLI_VER" --locked
          fi

      - name: "Gate · fmt"
        shell: bash
        run: python tools/automation/check.py -Gate fmt

      - name: "Gate · clippy"
        shell: bash
        run: python tools/automation/check.py -Gate clippy

      - name: "Gate · build"
        shell: bash
        run: python tools/automation/check.py -Gate build

      - name: "Gate · test"
        shell: bash
        run: python tools/automation/check.py -Gate test

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}

      - name: "Gate · ui (tsc + i18n_lint)"
        shell: bash
        run: |
          npm install -g "typescript@$TS_VER"
          python tools/automation/check.py -Gate ui

      - name: Build installers (cargo tauri build)
        working-directory: src-tauri
        shell: bash
        run: cargo tauri build --config .build-version.json

      - name: Assert bundle layout + startup smoke
        shell: bash
        run: python tools/automation/assert_bundle.py --smoke

      # **一个格式一个 artifact**。artifact 下载永远是 zip（GitHub 的机制，改不了），
      # 所以只能拆粒度：合成一个包的话「只想要 deb」也得下完 274 MB 再解开。
      # 每个都 `if-no-files-found: error`：少出一样就当场红，不产出残缺的包。
      # **Windows 只有 NSIS 一个安装包**（`tauri.windows.conf.json` 把 targets 收成 ["nsis"]）：
      # 只留一条安装/更新路径，不再出 MSI。
      # 自动写缓存：新键才写，已有同键会失败（continue-on-error）；下次同 Cargo.lock 直接命中。
      # 编译本身由 sccache 缓存（按对象指纹，跨 tag 复用），这里只保 registry / tauri-cli。
      - name: Save cargo registry（自动）
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}

      - name: Save cargo-tauri binary（自动）
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Windows-x64-${{ env.VERSION }}-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  linux:
    name: 打包 · Linux（deb + rpm + AppImage）
    # **打包基线 = ubuntu-24.04（glibc 2.39），不是最新的 26.04。**
    # 理由是 glibc 的版本化符号**单方向兼容**：新 glibc 必定保留全部旧版本标签
    # （实测 2.43 的 libm 同时带 `log10f@GLIBC_2.2.5` 与 `log10f@@GLIBC_2.43`），
    # 所以老基线编的包在新发行版上一律能跑；而反过来不行 ——
    # 在 2.43 上编的包要求 `log10f@GLIBC_2.43`，装到 2.39 的 24.04 上直接
    # `symbol lookup error` 起不来（实测确认）。
    # 因此分两条线：**发给别人跑的包**编在最老的支持基线上（本 job），
    # **验证能跑在最新发行版**交给 tests.yml 的 ubuntu-24.04（它只跑门禁，不出包）。
    # 24.04 也不是随便挑的：onnxruntime（ort）预编译包要求 glibc ≥ 2.39，
    # 正好是 24.04 的版本 —— 再老就编不过了，这就是支持范围的下限。
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set app version（tag / 日期）
        shell: bash
        run: python tools/automation/version.py >> "$GITHUB_ENV"

      - name: Load versions + cache keys (versions.env 是唯一来源)
        shell: bash
        run: |
          # **必须 source，不能只写 GITHUB_ENV**：写进 GITHUB_ENV 的变量要到**后续 step**
          # 才注入进程环境，而缓存键就在这一步里拼 —— 只写不 source 的话 $CACHE_GEN / $TCLI_VER
          # 全是空串，拼出来的键是残的（曾因此让 tauri-cli 那步直接失败）。理由见 tests.yml。
          set -a
          . tools/automation/versions.env
          set +a
          # 再写进 GITHUB_ENV，供后续 step 使用
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
            esac
          done < tools/automation/versions.env
          lock="${{ hashFiles('src-tauri/Cargo.lock') }}"
          # 发行版标记来自 versions.env；缓存键按发行版隔离（C 依赖的中间产物不能跨发行版回读）。
          # release 的编译复用由 sccache 承担，不预暖 target/。
          case "$RUNNER_OS" in
            Windows) os_tag="windows" ;;
            *)       os_tag="$LINUX_CACHE_TAG" ;;
          esac
          {
            printf 'CARGO_CACHE_KEY=purevox-%s-%s-cargo-%s-%s\n' "$RUNNER_OS" "$os_tag" "$CACHE_GEN" "$lock"
            printf 'TAURI_CLI_KEY=purevox-%s-tauri-cli-%s\n' "$RUNNER_OS" "$TCLI_VER"
          } >> "$GITHUB_ENV"
          echo "CARGO_CACHE_KEY=$CARGO_CACHE_KEY"

      # Tauri wry 运行时 (WebKitGTK 4.1) + cpal (ALSA) + 打 rpm 需要 rpmbuild。
      - name: Install Linux system deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev libgtk-3-dev libasound2-dev \
            libopus0 xvfb pkg-config file rpm

      - name: sccache（编译器对象缓存，自动更新）
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Rust toolchain (rustfmt + clippy)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      # restore 一律不写 restore-keys，理由见 tests.yml 同处注释。
      # release 的编译复用由 sccache 负责；target/release 不做目录缓存（太大）。
      - name: Restore cargo registry (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}


      - name: Restore cargo-tauri binary (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}

      - name: Install tauri-cli（仅在缺失时编译，版本钉死）
        shell: bash
        run: |
          # 判据是「盘上有没有」，不是 cache-hit 输出 —— runner 镜像可能已预装 cargo-tauri，
          # 那时 cache-hit 是 false 但二进制已在，`cargo install` 会撞
          # "binary already exists in destination"。command -v 判断天然幂等。
          # restore-keys 已全部去掉，所以「部分命中」这种情形不再存在。
          if command -v cargo-tauri >/dev/null 2>&1; then
            echo "cargo-tauri 已存在（缓存或镜像预装），跳过安装"
          else
            cargo install tauri-cli --version "$TCLI_VER" --locked
          fi

      - name: "Gate · fmt"
        shell: bash
        run: python tools/automation/check.py -Gate fmt

      - name: "Gate · clippy"
        shell: bash
        run: python tools/automation/check.py -Gate clippy

      - name: "Gate · build"
        shell: bash
        run: python tools/automation/check.py -Gate build

      - name: "Gate · test"
        shell: bash
        run: python tools/automation/check.py -Gate test

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}

      - name: "Gate · ui (tsc + i18n_lint)"
        run: |
          npm install -g "typescript@$TS_VER"
          python tools/automation/check.py -Gate ui

      - name: Build installers (cargo tauri build)
        working-directory: src-tauri
        run: cargo tauri build --config .build-version.json

      - name: Assert bundle layout + smoke (deb)
        shell: bash
        run: python tools/automation/assert_bundle.py --smoke

      - name: Cross-distro install test (deb→ubuntu, rpm→fedora, AppImage)
        shell: bash
        run: python tools/automation/test_packages.py

      # 一个格式一个 artifact，理由同上（AppImage 最大，单它就 ~200 MB）。
      # 自动写缓存：新键才写，已有同键会失败（continue-on-error）；下次同 Cargo.lock 直接命中。
      # 编译本身由 sccache 缓存（按对象指纹，跨 tag 复用），这里只保 registry / tauri-cli。
      - name: Save cargo registry（自动）
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}

      - name: Save cargo-tauri binary（自动）
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Linux-x64-${{ env.VERSION }}-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload rpm
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Linux-x64-${{ env.VERSION }}-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Linux-x64-${{ env.VERSION }}-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------- Android
  android:
    name: 打包 · Android（签名 release APK）
    # APK 跑在 Android 上、与宿主 glibc 无关，直接上 26.04。
    # JDK 由 actions/setup-java + versions.env 的 JDK_VER 钉死（见下），不靠 runner 默认值 ——
    # 26.04 的默认 JDK 是 25。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Load versions (versions.env 是唯一来源)
        shell: bash
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
            esac
          done < tools/automation/versions.env

      - name: Set app version（tag / 日期）
        shell: bash
        run: python3 tools/automation/version.py >> "$GITHUB_ENV"

      # v4 已经 deprecated（它还 target Node 20，runner 上被强制跑在 Node 24）。
      # v5 是当前版本，参数（distribution / java-version）不变。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VER }}

      # setup-android 的 `packages` 必须显式给：默认包列表含已下架的 `tools`
      # （sdkmanager tools 直接 exit 1）。平台 / build-tools 由本仓库脚本负责。
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform + build-tools
        run: python tools/automation/install_android_sdk.py

      # release 签名。**凭据一律来自 secrets、keystore 还原到 $RUNNER_TEMP（仓库外）** ——
      # 仓库里一个凭据文件都没有，所以不存在「忘了 gitignore 把私钥提交上去」这种坑。
      # PV_REQUIRE_SIGNING=1 让 gradle 在缺凭据时**直接失败**，绝不产出装不上的未签名包
      # （Android 不允许安装未签名包，事后只能重发一版）。
      - name: Materialize signing keystore (from secrets)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          # **逐个显式列名字**，不用 `${!v}` 间接展开 —— 那玩意在 `set -u` 下遇到未设置的
          # 变量会先抛 "unbound variable"，报错完全指不到 secret 上（实测）。
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_B64"
          [ -z "$KEY_ALIAS" ]    && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASS" ]     && missing="$missing ANDROID_KEY_PASS"
          if [ -n "$missing" ]; then
            echo "::error::secret 缺失或为空：$missing —— 无法签出可安装的 release APK"
            echo "::error::Android 不允许安装未签名包；宁可当场失败，也不要发一个装不上的版本"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/purevox-release.jks"
          echo "PV_KEYSTORE=$RUNNER_TEMP/purevox-release.jks" >> "$GITHUB_ENV"
          echo "PV_KEY_ALIAS=$KEY_ALIAS"                     >> "$GITHUB_ENV"
          echo "PV_KEY_PASS=$KEY_PASS"                       >> "$GITHUB_ENV"
          echo "PV_REQUIRE_SIGNING=1"                        >> "$GITHUB_ENV"
          "$JAVA_HOME/bin/keytool" -list -keystore "$RUNNER_TEMP/purevox-release.jks" \
            -storepass "$KEY_PASS" -alias "$KEY_ALIAS" \
            | sed 's/^/  [keystore] /'

      - name: Build release APK（已签名）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PpvVersion="$VERSION" -PpvVersionCode="$ACODE"

      - name: Stage APK
        run: |
          # 文件名用 `.apk`（点），artifact 名用 `-apk`（短横线）—— 与 Windows / Linux 那几档
          # 一致，也与发版时统一重命名成的 `…-android-arm64.apk` 对得上。
          #
          # **别写死 `app-release.apk`**：AGP 的默认产物名已经被 `app/build.gradle.kts` 改成
          # `PureVox-<版本>-android-arm64.apk`（debug 是 `PureVox-<版本>-debug-android-arm64.apk`，
          # 见那里的「APK 文件名」段）。写死旧名字的后果是这条 mv 直接
          # 「No such file」，而且**只在打 tag 时才暴露**（那条路平时不跑）。
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/PureVox-*-android-arm64.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::预期恰好 1 个 release APK，实际 ${#apks[@]} 个：${apks[*]:-（一个都没有）}"
            exit 1
          fi
          mv "${apks[0]}" "PureVox-Android-arm64-${{ env.STAMP }}.apk"

      # **确证产物真的可安装**：签名 + 对齐缺一不可。
      #  · 签名：「assembleRelease 成功」不等于「签名生效了」—— gradle 完全可以静默出
      #    `app-release-unsigned.apk`，那种包用户根本装不上。apksigner verify 同时验
      #    证书链与各签名方案（v1/v2/v3），比肉眼看文件名可靠。
      #  · zipalign：官方定义的「release-ready APK」是**对齐过**的（安装更快、内存映射更省）。
      #    AGP 会自动做，但「会自动」不等于「一定做了」，所以在这里断言。
      - name: Verify APK（签名 + 对齐）
        shell: bash
        run: |
          set -euo pipefail
          # 用 glob 数组而不是 `ls`：文件名带空格/换行时解析 `ls` 输出必错（脚本里的老毛病）。
          # 顺带断言「恰好一个 APK」—— 上一步写错了后缀名、这里静默验了别的文件的情况也挡掉。
          shopt -s nullglob
          apks=(PureVox-Android-arm64-*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::预期恰好 1 个 APK，实际 ${#apks[@]} 个：${apks[*]:-（一个都没有）}"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify \
            --verbose --print-certs "${apks[0]}" | sed 's/^/  [apksigner] /'
          # v3 必须真的在（gradle 里 enableV3Signing = true）。
          # **先存进变量再 grep**：不要写 `apksigner … | grep -q`，`grep -q` 一匹配上就
          # 关掉管道，apksigner 收到 SIGPIPE 返回非零，`set -o pipefail` 会把这一整条
          # 判成失败 —— 明明验过了却报「没有 v3 签名」（本地实测踩到）。
          verify_out=$("$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" \
            verify --verbose "${apks[0]}")
          if ! grep -q 'v3 scheme.*: true' <<<"$verify_out"; then
            echo "::error::APK 没有 v3 签名（enableV3Signing 没生效？密钥轮换能力就没了）"
            printf '%s\n' "$verify_out" | sed 's/^/  [apksigner] /'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/zipalign" -c -v 4 "${apks[0]}" \
            | tail -1 | sed 's/^/  [zipalign] /'

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Android-arm64-${{ env.STAMP }}-apk
          path: PureVox-Android-arm64-*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: 发版（tag → 附加全部产物）
    runs-on: ubuntu-24.04
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes 需要上一个 tag 起的完整历史

      # **本 job 也必须自己推一次版本号**：下面的产物文件名取自 `${{ env.VERSION }}`，
      # 而 job 级 / workflow 级 env 都没有它（只有 CARGO_TERM_COLOR 等），别的 job 里
      # 推的那次**不跨 job**。不补这一步，产物会叫 `PureVox--windows-x64-setup.exe`
      # （版本段空成两个连字符），release 标题也变成 `PureVox `。
      - name: Set app version（产物文件名要用）
        shell: bash
        run: python tools/automation/version.py >> "$GITHUB_ENV"

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Build release notes (release_notes.py 是唯一实现)
        shell: bash
        run: python tools/automation/release_notes.py --tag "${{ github.ref_name }}" --out notes.md

      # **实现落在 tools/automation/release_stage.sh，不内联在这里。** 这段脚本（按扩展名
      # stage → 统一改名 → 交给 gh）此前从没成功执行过，第一次真打 tag 就暴露出
      # 「收集完文件名后 cd .. 回上一层 → 相对路径全失效 → gh 报 no matches found」。
      # 内联的脚本等于没被测过的脚本；落到文件里后 `run_release_stage.py` 能用假产物树
      # 与假 gh 在本地把它跑通，**测的和发布的是同一份代码**。
      - name: Create GitHub release（实现在 tools/automation/release_stage.sh）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ env.VERSION }}
          ARTIFACTS: artifacts
        run: bash tools/automation/release_stage.sh
