# PureVox 打包 / 发版 —— **多平台**：Windows（MSI+NSIS）、Linux（deb+rpm+AppImage）、
# Android（debug APK）。触发：推 tag `v*`（构建 + 建 release）或手动 `workflow_dispatch`
# （只构建、不建 release）。**分支推送不触发**；代码门禁见 tests.yml（手动）。
# 纪律：缓存 restore-only（唯一写入者 warm-cache.yml）；版本/键唯一来源
# tools/automation/versions.env；门禁实现唯一 = tools/automation/check.ps1。
# 注意 AGENTS.md 维护准则：CI 失败、从未生成 release 的 tag 必须删除
# （git tag -d <tag> && git push origin :refs/tags/<tag>），否则会截断下个 tag 的提交记录。
name: 打包发版（tag v* / 手动）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # linuxdeploy / appimagetool 需要 FUSE；CI 容器里没有，用解包运行模式。
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: 打包 · Windows（MSI + NSIS）
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Set app version（tag / 日期）
        run: ./tools/automation/version.ps1 | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Load versions + cache keys (versions.env 是唯一来源)
        run: |
          $vars = @{}
          Get-Content tools/automation/versions.env | Where-Object { $_ -match '^(\w+)=(.*)$' } | ForEach-Object {
            $vars[$Matches[1]] = $Matches[2]
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $lock = "${{ hashFiles('src-tauri/Cargo.lock') }}"
          "CARGO_CACHE_KEY=purevox-$env:RUNNER_OS-cargo-$($vars['CACHE_GEN'])-$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TARGET_DEBUG_KEY=purevox-$env:RUNNER_OS-target-dbg-$($vars['CACHE_GEN'])-$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TARGET_RELEASE_KEY=purevox-$env:RUNNER_OS-target-rel-$($vars['CACHE_GEN'])-$($vars['TCLI_VER'])-$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_CLI_KEY=purevox-$env:RUNNER_OS-tauri-cli-$($vars['TCLI_VER'])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust toolchain (rustfmt + clippy)
        run: |
          rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$env:RUST_TOOLCHAIN"

      - name: Restore cargo registry (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: |
            purevox-${{ runner.os }}-cargo-${{ env.CACHE_GEN }}-

      - name: Restore target/debug (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: src-tauri/target/debug
          key: ${{ env.TARGET_DEBUG_KEY }}
          restore-keys: |
            purevox-${{ runner.os }}-target-dbg-${{ env.CACHE_GEN }}-

      - name: Restore target/release (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: src-tauri/target/release
          key: ${{ env.TARGET_RELEASE_KEY }}
          restore-keys: |
            purevox-${{ runner.os }}-target-rel-${{ env.CACHE_GEN }}-

      - name: Restore cargo-tauri binary (restore-only)
        id: tcli
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}

      - name: Install tauri-cli (仅缓存未命中时编译，版本钉死)
        if: steps.tcli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "$env:TCLI_VER" --locked

      - name: "Gate · fmt"
        run: ./tools/automation/check.ps1 -Gate fmt

      - name: "Gate · clippy"
        run: ./tools/automation/check.ps1 -Gate clippy

      - name: "Gate · build"
        run: ./tools/automation/check.ps1 -Gate build

      - name: "Gate · test"
        run: ./tools/automation/check.ps1 -Gate test

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}

      - name: "Gate · ui (tsc + i18n_lint)"
        run: |
          npm install -g "typescript@$env:TS_VER"
          ./tools/automation/check.ps1 -Gate ui

      - name: Build installers (cargo tauri build)
        working-directory: src-tauri
        run: cargo tauri build --config .build-version.json

      - name: Assert bundle layout + startup smoke
        run: ./tools/automation/assert_bundle.ps1 -Smoke

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  linux:
    name: 打包 · Linux（deb + rpm + AppImage）
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Set app version（tag / 日期）
        run: ./tools/automation/version.ps1 | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Load versions + cache keys (versions.env 是唯一来源)
        run: |
          $vars = @{}
          Get-Content tools/automation/versions.env | Where-Object { $_ -match '^(\w+)=(.*)$' } | ForEach-Object {
            $vars[$Matches[1]] = $Matches[2]
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $lock = "${{ hashFiles('src-tauri/Cargo.lock') }}"
          "CARGO_CACHE_KEY=purevox-$env:RUNNER_OS-cargo-$($vars['CACHE_GEN'])-$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TARGET_DEBUG_KEY=purevox-$env:RUNNER_OS-target-dbg-$($vars['CACHE_GEN'])-$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TARGET_RELEASE_KEY=purevox-$env:RUNNER_OS-target-rel-$($vars['CACHE_GEN'])-$($vars['TCLI_VER'])-$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_CLI_KEY=purevox-$env:RUNNER_OS-tauri-cli-$($vars['TCLI_VER'])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Tauri wry 运行时 (WebKitGTK 4.1) + cpal (ALSA) + 打 rpm 需要 rpmbuild。
      - name: Install Linux system deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev libgtk-3-dev libasound2-dev \
            libopus0 xvfb pkg-config file rpm

      - name: Install Rust toolchain (rustfmt + clippy)
        run: |
          rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$env:RUST_TOOLCHAIN"

      - name: Restore cargo registry (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: |
            purevox-${{ runner.os }}-cargo-${{ env.CACHE_GEN }}-

      - name: Restore target/debug (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: src-tauri/target/debug
          key: ${{ env.TARGET_DEBUG_KEY }}
          restore-keys: |
            purevox-${{ runner.os }}-target-dbg-${{ env.CACHE_GEN }}-

      - name: Restore target/release (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: src-tauri/target/release
          key: ${{ env.TARGET_RELEASE_KEY }}
          restore-keys: |
            purevox-${{ runner.os }}-target-rel-${{ env.CACHE_GEN }}-

      - name: Restore cargo-tauri binary (restore-only)
        id: tcli
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}

      - name: Install tauri-cli (仅缓存未命中时编译，版本钉死)
        if: steps.tcli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "$env:TCLI_VER" --locked

      - name: "Gate · fmt"
        run: ./tools/automation/check.ps1 -Gate fmt

      - name: "Gate · clippy"
        run: ./tools/automation/check.ps1 -Gate clippy

      - name: "Gate · build"
        run: ./tools/automation/check.ps1 -Gate build

      - name: "Gate · test"
        run: ./tools/automation/check.ps1 -Gate test

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}

      - name: "Gate · ui (tsc + i18n_lint)"
        run: |
          npm install -g "typescript@$env:TS_VER"
          ./tools/automation/check.ps1 -Gate ui

      - name: Build installers (cargo tauri build)
        working-directory: src-tauri
        run: cargo tauri build --config .build-version.json

      - name: Assert bundle layout + smoke (deb)
        shell: bash
        run: bash tools/automation/assert_bundle_linux.sh --smoke

      - name: Cross-distro install test (deb→ubuntu, rpm→fedora, AppImage)
        shell: bash
        run: bash tools/automation/test_packages.sh

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------- Android
  android:
    name: 打包 · Android（debug APK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load versions (versions.env 是唯一来源)
        shell: pwsh
        run: |
          Get-Content tools/automation/versions.env | Where-Object { $_ -match '^(\w+)=(.*)$' } | ForEach-Object {
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Set app version（tag / 日期）
        shell: bash
        run: bash tools/automation/version.sh >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VER }}

      # setup-android 的 `packages` 必须显式给：默认包列表含已下架的 `tools`
      # （sdkmanager tools 直接 exit 1）。平台 / build-tools 由本仓库脚本负责。
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform + build-tools
        run: bash tools/automation/install_android_sdk.sh

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PpvVersion="$VERSION"

      - name: Stage APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             "PureVox-Android-arm64-${{ env.STAMP }}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Android-arm64-${{ env.STAMP }}-debug-apk
          path: PureVox-Android-arm64-*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: 发版（tag → 附加全部产物）
    runs-on: ubuntu-latest
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes 需要上一个 tag 起的完整历史

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Build release notes (release_notes.ps1 是唯一实现)
        shell: pwsh
        run: ./tools/automation/release_notes.ps1 -Tag "${{ github.ref_name }}" -OutFile notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          files=$(find . -type f | sort | tr '\n' ' ')
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "PureVox ${{ github.ref_name }}" \
            --notes-file "$GITHUB_WORKSPACE/notes.md" \
            $files
