# PureVox 桌面端打包 / 发版 —— **当前是便携测试通道**（`RELEASE-CHANNELS.md`）。
#
# 安装包流水线（NSIS / AppImage / deb / rpm）随 GPUI 重建下线，尚未恢复；现在 `v*` tag
# 只产出 **Windows 便携 zip**（exe + opus.dll + models/，解压即用）。恢复正式安装包时
# 改这个文件，不要恢复旧 tauri-cli 步骤（那条路已经没有 `tauri.conf.json`）。
#
# 安卓是**独立通道**：tag `android-v*`、工作流 `android-release.yml`、独立 release 与日志。
name: 桌面端打包发版（tag v* / 手动）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PYTHONIOENCODING: utf-8

jobs:
  windows-portable:
    name: 打包 · Windows 便携测试版
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Load versions (versions.env 是唯一来源)
        shell: bash
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
            esac
          done < tools/automation/versions.env

      - name: Set app version（tag / 日期）
        shell: bash
        run: python tools/automation/version.py >> "$GITHUB_ENV"

      - name: Install Rust toolchain (rustfmt + clippy)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      # 门禁唯一实现 = check.py；这里跑 Rust 四道（fmt/clippy/build/test）。
      # `ui` 在 GPUI 下只剩调试面板、没有 jsconfig，会明确跳过。
      - name: "Gate · fmt"
        shell: bash
        run: python tools/automation/check.py -Gate fmt

      - name: "Gate · clippy"
        shell: bash
        run: python tools/automation/check.py -Gate clippy

      - name: "Gate · test"
        shell: bash
        run: python tools/automation/check.py -Gate test

      # 打包脚本自己跑 `cargo build --release`（带版本环境变量），再收 exe + opus.dll + models/。
      - name: Build portable package
        shell: bash
        run: python tools/automation/package_portable.py

      - name: Upload portable zip
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-portable-${{ env.STAMP }}
          path: dist/PureVox-*-windows-x64-portable.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: 发版（v* tag → 只发便携包）
    runs-on: ubuntu-24.04
    needs: [windows-portable]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes 需要上一个 tag 起的完整历史

      - name: Set app version（产物文件名要用）
        shell: bash
        run: python tools/automation/version.py >> "$GITHUB_ENV"

      - name: Download portable zip
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Build release notes（桌面范围，排除 android/）
        shell: bash
        run: |
          python tools/automation/release_notes.py \
            --platform desktop --tag "${{ github.ref_name }}" --out notes.md

      - name: Create GitHub release（实现在 tools/automation/release_stage.sh）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ env.VERSION }}
          PLATFORM: portable
          ARTIFACTS: artifacts
        run: bash tools/automation/release_stage.sh
