[package]
name = "purevox"
version = "0.1.0"
description = "PureVox"
authors = ["a2heng"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.5", features = ["tray-icon", "image-png"] }
# devtools：WebView2 开发者工具（JS 交互式调试；迁移期 release 也保留，见 AGENTS.md §1）
tauri-runtime-wry = { version = "3.0.0-alpha.5", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 调试接口：系统 CPU / 内存
sysinfo = "0.39"
# 音频设备枚举与采集（单一实现路径）
cpal = "0.18"
# 重采样（引擎唯一重采样实现）
rubato = "5"
# 实时回调 -> 工作线程的无锁单生产者单消费者环形缓冲
rtrb = "0.4"
# 网络：WebSocket 服务（手机 ⇄ 电脑，DESIGN.md §4.1），跨平台
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# 更新检查：查 GitHub Releases + 下载安装包（reqwest 已随 tauri 进入依赖树，
# 这里直接复用；TLS 后端与 ort 的 ureq 同一套 native-tls，不新增 C 编译链）
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "default-tls",
] }
# 调试频谱
rustfft = "6"
# 媒体库导入：解码任意常见音频 → 归一为 48k 单声道 WAV（纯 Rust，不引入 C 编译链；
# 与 Opus 运行时加载同一纪律）。
# 注意 symphonia 的 feature 分两类：**容器**（format）与**解码器**（codec），缺一不可：
#   `wav` = 容器（只开 `pcm` 只有 PCM 解码器、没有 RIFF 读取器，wav 直接打不开），
#   `ogg` = vorbis 的容器，`isomp4` = m4a / AAC-in-MP4 的容器。
symphonia = { version = "0.5", default-features = false, features = [
  # 容器
  "wav",
  "ogg",
  "isomp4",
  # 解码器
  "mp3",
  "aac",
  "flac",
  "vorbis",
  "pcm",
] }
# 界面文件选择 → base64 文本过 IPC：浏览器 <input type=file> 只能拿到字节数组，
# 编码成一个 JSON 字符串比逐字节数组小一个量级（随 tauri 进入依赖树，无需新增下载）
base64 = "0.23"
# ONNX 推理（onnxruntime 绑定；构建时下载 onnxruntime 并把 dll 复制到产物旁）
# rc.15 起 `Session::builder` 要显式传 `Environment`（`infer::ort_env`），已跟进。
# 升级前后都比过：同一模型 rc.13 / rc.15 都是 ~5.7 ms/hop（`cargo run --example ort_bench`，
# 单线程 + 关自旋）。**注意 bench 必须带这两个设置**，默认多线程池忙等会报 ~10 ms。
# 换模型也要比：202609c 是 1.8 ms，现役 202609b 是 5.7 ms（模型本身的差别，不是绑定的锅）。
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
  "std",
  "download-binaries",
  "copy-dylibs",
  "tls-native",
  "api-23",
] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = { version = "2", default-features = false, features = ["std"] }
hyper-util = { version = "0.1", features = ["server-auto", "http1", "http2", "tokio"] }
mdns-sd = "0.21"

[target.'cfg(windows)'.dependencies]
# 调试接口：GPU 占用 / 显存（DXGI + PDH）、进程私有字节
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Registry",
  # 启动/停止：全局快捷键 + 提示音
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  # AEC 远端参考：输出设备 WASAPI 回环采集
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  # 网络：运行时加载预编译 opus.dll（不引入 C 编译链）
  "Win32_System_LibraryLoader",
  # 网络：枚举本机网卡（GetAdaptersAddresses），给「手机」面板选子网用
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# 内置 UI 截屏（开发/报障用）：WebKitGTK 自带的 webview snapshot，不依赖桌面截图协议。
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(unix)'.dependencies]
# 网络：运行时 dlopen 系统 libopus（`libopus.so.0`，Debian 包名 `libopus0`），
# 与 Windows 加载 opus.dll 同一契约（不引入 C 编译链）。
libc = "0.2"

[dev-dependencies]
# 网络回循测试的 WebSocket 客户端（不进产物）
tokio-tungstenite = "0.24"
