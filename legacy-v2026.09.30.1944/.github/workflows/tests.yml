name: PureVox Tests

# Independent test workflow: every branch push / manual trigger, no packaging,
# minutes. Fully decoupled from ci.yml (tag-triggered build+release):
#   - packaging validates "the packaged object and environment" (bundled-runtime
#     smoke inside ci.yml at tag time);
#   - this workflow only tests the code itself (syntax/smoke/suite).
# Cache discipline: restore-only from the shared buckets (keys composed from
# tools/automation/versions.env, same as ci.yml). All writes happen solely in cache.yml.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    name: Tests (embedded Python 3.12, no packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load cache key (tools/automation/versions.env is canonical)
        run: |
          . tools/automation/versions.env
          echo "LINUX_CACHE_KEY=purevox-linux-cache-${LINUX_CACHE_GEN}-cpython-${PBS_CPYTHON_VER}-appimagetool-x64" >> "$GITHUB_ENV"

      - name: Restore ~/.cache/purevox (read-only reuse of shared cache)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/purevox
          key: ${{ env.LINUX_CACHE_KEY }}

      # Embedded interpreter = the same runtime shipped in releases
      # (tarball hit in cache means no download, no compilation).
      - name: Bootstrap embedded Python + pinned deps
        run: ./bootstrap_python312.sh

      - name: Compile all sources (catch syntax errors)
        run: bash tools/automation/compileall.sh ./py312

      - name: Engine smoke (tools/automation/smoke.py is canonical)
        run: |
          ./py312 tools/automation/smoke.py

      - name: Test suite (playback correctness / transport / devices / session plan)
        run: |
          ./py312 tests/run_all.py
