</head>
<body class="debug-window debug-on">

<!--
  调试面板（浏览器版）：由本机只读调试接口提供（GET /debug/ui，静态资源随二进制内嵌），
  顶栏「调试面板」用系统浏览器打开它（独立进程，AGENTS.md 1.1）。
  页面只 fetch('/debug') 渲染同一份快照，不经过 WebView2 / IPC，也不自己算指标（1.3 / 1.4）。
  解耦的代价：面板截不到主窗口的图（跨进程）—— 内置截屏已移除，截图用系统工具。
-->
      <section id="debug" class="column debug" aria-label="Debug">

        <h2><span data-i18n="调试">调试</span> <span id="dbg-status" class="mono"></span></h2>

        <!-- 设备条带放在调试面板最上面：调试时最常看的就是每路流，不用往下翻过
             应用/系统/GPU。JS 与 CSS 不变，只是把渲染容器提前。 -->
        <div id="audio-streams"></div>

        <section>
          <h3 data-i18n="应用">应用</h3>
          <table class="kv">
            <tr>
              <th data-i18n="版本">版本</th><td id="app-version"></td>
              <th>PID</th><td id="app-pid"></td>
            </tr>
            <tr>
              <th data-i18n="运行时长">运行时长</th><td id="app-uptime"></td>
              <th data-i18n="快照时间">快照时间</th><td id="app-ts"></td>
            </tr>
            <tr><th data-i18n="调试接口">调试接口</th><td id="app-http" colspan="3"></td></tr>
          </table>
        </section>


        <section>
          <h3><span data-i18n="CPU 系统">CPU 系统</span> / <span data-i18n="内存">内存</span> <span id="sys-sampled" class="sub"></span></h3>
          <table class="kv">
            <tr>
              <th data-i18n="CPU 系统">CPU 系统</th><td id="cpu-system"></td>
              <th data-i18n="CPU 本进程">CPU 本进程</th><td id="cpu-process"></td>
            </tr>
            <tr>
              <th data-i18n="逻辑核数">逻辑核数</th><td id="cpu-cores"></td><th></th><td></td>
            </tr>
            <tr>
              <th data-i18n="内存 系统已用">内存 系统已用</th><td id="mem-used"></td>
              <th data-i18n="内存 系统可用">内存 系统可用</th><td id="mem-avail"></td>
            </tr>
            <tr>
              <th data-i18n="本进程 工作集">本进程 工作集</th><td id="mem-ws"></td>
              <th data-i18n="本进程 私有字节">本进程 私有字节</th><td id="mem-private"></td>
            </tr>
          </table>
          <p class="note" data-i18n="本进程不含 WebView2 子进程（界面渲染在 msedgewebview2.exe 中）。">本进程不含 WebView2 子进程（界面渲染在 msedgewebview2.exe 中）。</p>
        </section>

        <section>
          <h3>GPU</h3>
          <div id="gpu-state" class="state"></div>
          <table class="grid" id="gpu-table">
            <colgroup><col class="c-name" /><col class="c-num" /><col class="c-num" /><col class="c-mem" /><col class="c-num" /></colgroup>
            <thead>
              <tr>
                <th data-i18n="适配器">适配器</th>
                <th data-i18n="整卡占用">整卡占用</th>
                <th data-i18n="本进程占用">本进程占用</th>
                <th data-i18n="显存已用 / 总量">显存已用 / 总量</th>
                <th data-i18n="本进程显存">本进程显存</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section>
          <h3 data-i18n="音频">音频</h3>
          <table class="kv">
            <tr><th data-i18n="结论">结论</th><td id="audio-verdict" colspan="3"></td></tr>
            <tr><th data-i18n="引擎">引擎</th><td id="audio-engine" colspan="3"></td></tr>
            <tr><th data-i18n="参考录制">参考录制</th><td id="audio-recorder" colspan="3"></td></tr>
            <tr><th data-i18n="延时校准">延时校准</th><td id="audio-calib" colspan="3"></td></tr>
          </table>
          <!-- 网络只留只读状态行；开关、二维码、远程输入都在网络行卡片里（见 netrow.js） -->
          <h3 data-i18n="网络">网络</h3>
          <table class="kv">
            <tr><th data-i18n="客户端 ⇄ 电脑">客户端 ⇄ 电脑</th><td id="net-status" colspan="3"></td></tr>
            <tr><th data-i18n="出站水位">出站水位</th><td id="net-subs" colspan="3"></td></tr>
            <tr><th data-i18n="结论">结论</th><td id="net-verdict" colspan="3"></td></tr>
            <tr><th data-i18n="Opus 库">Opus 库</th><td id="net-codec" colspan="3"></td></tr>
          </table>
        </section>
      </section>

<script src="/debug/ui/i18n.js"></script>
<script src="/debug/ui/jsdebug.js"></script>
<script src="/debug/ui/snapshot.js"></script>
<script src="/debug/ui/viz.js"></script>
<script src="/debug/ui/debug.js"></script>
</body>
</html>
