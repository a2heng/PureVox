name: PureVox CI

# Tag push (v...) builds everything and releases; branch pushes stay cheap
# (tests only, in test.yml). Manual dispatch verifies the branch w/o tagging.
#
# Shared logic lives in tools/automation/ (single implementation path): workflows only
# declare jobs/matrix/keys and call the scripts. Cache writes happen ONLY in
# cache.yml; every job here is restore-only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal packages: deb (Ubuntu) + AppImage; fedora -> rpm; python3.12 baseline.
          - distro: ubuntu-24.04
            container: ubuntu:24.04
            # Prebuilt embedded Python (python-build-standalone install_only,
            # see bootstrap_python312.sh) needs no compilation.
            # file: appimagetool requires the `file` command at packaging time.
            # noble (system Python 3.12 + new pip): pinned numpy 2.5 has no
            # 3.10 wheels, jammy cannot run the engine smoke.
            sysdeps: "make pkg-config libopus0 python3 python3-pip python3-setuptools imagemagick wget git file"
            pkg_deb: true
            pkg_appimage: true
          - distro: fedora
            container: fedora:latest
            # wget: bootstrap tarball download; ImageMagick: icon ico->png;
            # cpio: rpm artifact unpack smoke (rpm2cpio | cpio)
            sysdeps: "make python3 python3-pip python3-setuptools rpm-build wget ImageMagick cpio"
            pkg_rpm: true
          # Python 3.12 baseline: verify the pure-Python engine imports and runs there
          # (CI matrix uses 3.12; bundled runtime is 3.12).
          - distro: python3.12
            container: python:3.12-bullseye
            sysdeps: ""
            baseline: true
    container:
      image: ${{ matrix.container }}
    steps:
      # Install system dependencies BEFORE checkout: containers have no git, so
      # actions/checkout would fall back to the REST API download (no .git dir).
      # tools/ci is unavailable this early, so the retry policy from
      # tools/automation/sysdeps.sh is inlined here (3 attempts, dnf with long timeout).
      - name: Install system dependencies
        run: |
          if [ -n "${{ matrix.sysdeps }}" ]; then
            if command -v apt-get >/dev/null; then
              for i in 1 2 3; do apt-get update -qq && break || sleep $((i * 10)); done
              for i in 1 2 3; do DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ${{ matrix.sysdeps }} && break || sleep $((i * 10)); done
            else
              for i in 1 2 3; do dnf install -y --quiet --setopt=retries=5 --setopt=timeout=60 ${{ matrix.sysdeps }} && break || sleep $((i * 10)); done
            fi
          fi

      - uses: actions/checkout@v7

      - name: Load versions + cache keys (tools/automation/versions.env is canonical)
        run: |
          . tools/automation/versions.env
          {
            echo "LINUX_CACHE_KEY=purevox-linux-cache-${LINUX_CACHE_GEN}-cpython-${PBS_CPYTHON_VER}-appimagetool-x64"
            echo "OPUS_CACHE_KEY=purevox-android-opus-src-${OPUS_VER}"
          } >> "$GITHUB_ENV"

      - name: Set build timestamp (tools/automation/version.sh is canonical)
        id: ts
        run: |
          eval "$(bash tools/automation/version.sh)"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      - name: Install Python deps (pinned, from requirements-linux.txt)
        run: |
          PY="python3"; [ "${{ matrix.distro }}" = "python3.12" ] && PY="python"
          bash tools/automation/pip_install.sh "$PY" requirements-linux.txt pillow

      # Restore-only: cache writes happen solely in cache.yml (main pushes +
      # weekly schedule). Tag runs never write, so no per-tag 120MB duplicates.
      - name: Restore ~/.cache/purevox (cpython tarball + appimagetool)
        if: matrix.pkg_deb || matrix.pkg_appimage || matrix.pkg_rpm
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/purevox
          key: ${{ env.LINUX_CACHE_KEY }}

      - name: Engine smoke test (tools/automation/smoke.py is canonical)
        run: |
          PY="python3"; [ "${{ matrix.distro }}" = "python3.12" ] && PY="python"
          "$PY" tools/automation/smoke.py

      - name: Assert Python 3.12 baseline (python3.12 only)
        if: matrix.baseline
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 12); print('Python', sys.version.split()[0])"

      - name: Package deb (Ubuntu)
        if: matrix.pkg_deb
        run: |
          bash pack_deb.sh
          ls -lh dist/PureVox-Linux-x64-*.deb

      # Artifact-level smoke: unpack the deb and run engine + tests with the
      # PACKAGED python312 (exposes missing deps / broken embedded runtimes).
      - name: Bundled-runtime smoke (deb artifact, embedded python312)
        if: matrix.pkg_deb
        run: |
          bash tools/automation/bundled_smoke.sh deb dist/PureVox-Linux-x64-*.deb

      - name: Upload deb artifact
        if: matrix.pkg_deb
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Linux-x64-${{ steps.ts.outputs.stamp }}-release-deb
          path: dist/PureVox-Linux-x64-*.deb
          if-no-files-found: error

      - name: Package rpm (Fedora)
        if: matrix.pkg_rpm
        run: |
          bash pack_rpm.sh
          ls -lh dist/PureVox-Linux-x64-*.rpm

      - name: Bundled-runtime smoke (rpm artifact, embedded python312)
        if: matrix.pkg_rpm
        run: |
          set -o pipefail
          bash tools/automation/bundled_smoke.sh rpm dist/PureVox-Linux-x64-*.rpm

      - name: Upload rpm artifact
        if: matrix.pkg_rpm
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Linux-x64-${{ steps.ts.outputs.stamp }}-release-rpm
          path: dist/PureVox-Linux-x64-*.rpm
          if-no-files-found: error

      - name: Package AppImage (best-effort, bundles embedded python312)
        if: matrix.pkg_appimage
        continue-on-error: true
        run: |
          bash pack_appimage.sh
          ls -lh dist/PureVox-Linux-x64-*.AppImage

      # Same best-effort terms as the packaging step above.
      - name: Bundled-runtime smoke (AppImage artifact)
        if: matrix.pkg_appimage
        continue-on-error: true
        run: |
          bash tools/automation/bundled_smoke.sh appimage dist/PureVox-Linux-x64-*.AppImage

      - name: Upload AppImage artifact
        if: matrix.pkg_appimage
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Linux-x64-${{ steps.ts.outputs.stamp }}-release-appimage
          path: dist/PureVox-Linux-x64-*.AppImage
          if-no-files-found: ignore

  windows:
    name: Windows (pure-Python bundle directory)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load cache generation (tools/automation/versions.env is canonical)
        shell: pwsh
        run: |
          Get-Content tools/automation/versions.env | Where-Object { $_ -match '^(\w+)=(.*)$' } | ForEach-Object {
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Set build timestamp (tools/automation/version.ps1 is canonical)
        id: ts
        shell: pwsh
        run: |
          . tools/automation/version.ps1
          "stamp=$STAMP" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Restore-only (writes happen solely in cache.yml): the built-in
      # setup-python cache is not used because it always writes into the
      # current ref scope (one duplicate per tag).
      - name: Restore pip wheel cache
        uses: actions/cache/restore@v6
        with:
          path: ~\AppData\Local\pip\Cache
          key: purevox-windows-pip-${{ env.WINDOWS_PIP_CACHE_GEN }}-${{ hashFiles('requirements-win.txt') }}
          restore-keys: |
            purevox-windows-pip-${{ env.WINDOWS_PIP_CACHE_GEN }}-

      - name: Install Python deps (pinned, from requirements-win.txt)
        shell: pwsh
        run: |
          python -m pip install -q -r requirements-win.txt

      - name: Compile all Python sources (catch syntax errors before packaging)
        shell: pwsh
        run: |
          $srcs = Get-Content tools/automation/compileall_srcs.txt | Where-Object { $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*$' }
          python -m compileall -q @srcs
          Write-Host "compileall OK"

      # server/opus.dll is committed to the repo (prebuilt libopus, BSD), no download.

      - name: Build Windows bundle (PyInstaller, timestamped)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File build_win.ps1

      - name: Smoke import engine (tools/automation/smoke.py is canonical)
        shell: pwsh
        run: |
          python tools/automation/smoke.py

      # Bundle layout assertion: the PyInstaller one-folder key content
      # (exe / about pages add-data / models / opus.dll / html stream page).
      - name: Assert packaged bundle layout (PyInstaller output)
        shell: pwsh
        run: |
          $checks = @(
            "dist/PureVox/PureVox.exe",
            "dist/PureVox/_internal/about/changelog.md",
            "dist/PureVox/_internal/about/windows.md",
            "dist/PureVox/_internal/about/linux.md",
            "dist/PureVox/_internal/models",
            "dist/PureVox/_internal/server/opus.dll",
            "dist/PureVox/_internal/html/index.html"
          )
          foreach ($c in $checks) {
            if (-not (Test-Path $c)) { throw "bundle missing: $c" }
          }
          Write-Host "bundle layout OK"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          # upload-artifact already compresses to a zip; a separate 7z pass is pure waste.
          name: PureVox-Windows-x64-${{ steps.ts.outputs.stamp }}-release
          path: dist/PureVox
          if-no-files-found: error

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load versions + cache keys (tools/automation/versions.env is canonical)
        run: |
          . tools/automation/versions.env
          echo "OPUS_CACHE_KEY=purevox-android-opus-src-${OPUS_VER}" >> "$GITHUB_ENV"
          echo "GRADLE_CACHE_KEY=purevox-android-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/**/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}" >> "$GITHUB_ENV"
          echo "GRADLE_WRAPPER_KEY=purevox-android-gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}" >> "$GITHUB_ENV"

      - name: Set build timestamp (tools/automation/version.sh is canonical)
        id: ts
        run: |
          eval "$(bash tools/automation/version.sh)"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          # Default packages include "tools", which Google removed from the SDK
          # repo (sdkmanager now exits 1: "Failed to find package 'tools'").
          # platform-34 / build-tools / NDK are installed by the next step.
          packages: platform-tools

      # Retried + partial-NDK cleanup: a truncated NDK zip used to fail the
      # job outright (sdkmanager never repairs a corrupt partial tree).
      - name: Install SDK platform 34 + NDK r27
        run: bash tools/automation/install_android_sdk.sh

      # Gradle caches: restore-only in build jobs; writes happen solely in
      # warm-cache.yml on main. Tag-scoped saves are garbage nobody reads back.
      - name: Restore Gradle cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches
          key: ${{ env.GRADLE_CACHE_KEY }}
          restore-keys: |
            purevox-android-gradle-
      - name: Restore Gradle wrapper cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ env.GRADLE_WRAPPER_KEY }}
          restore-keys: |
            purevox-android-gradle-wrapper-

      # Opus source cache: restore-only here, writes happen solely in cache.yml.
      - name: Restore opus source cache
        uses: actions/cache/restore@v6
        with:
          path: android/opus-src
          key: ${{ env.OPUS_CACHE_KEY }}

      - name: Download Opus source (android/opus-src is gitignored)
        run: bash tools/automation/ensure_opus_src.sh

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK with timestamp
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk "PureVox-Android-arm64-${{ steps.ts.outputs.stamp }}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Android-arm64-${{ steps.ts.outputs.stamp }}-debug-apk
          path: PureVox-Android-arm64-*.apk
          if-no-files-found: error

  release:
    name: Release (tag -> attach all artifacts)
    runs-on: ubuntu-latest
    needs: [linux, windows, android]
    # Only when a tag is pushed (e.g. v2026.08.10.1517). The three build jobs
    # re-run for that exact ref so the release carries this tag's artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout full history (commit log for release notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Pack Windows bundle directory into a zip
        shell: bash
        run: |
          cd artifacts
          shopt -s nullglob
          for d in PureVox-Windows-*-release/; do
            zip -q -9 -r "${d%/}.zip" "$d"
            rm -rf "$d"
          done

      - name: Build release notes (tools/automation/release_notes.sh is canonical)
        run: |
          bash tools/automation/release_notes.sh "${GITHUB_REF_NAME}" notes.md \
            "自动发布：tag ${GITHUB_REF_NAME} 对应的 CI 构建产物（deb / rpm / AppImage / Windows / Android APK）。"

      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          files=$(find . -type f | sort | tr '\n' ' ')
          gh release create -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            --title "PureVox ${GITHUB_REF_NAME}" \
            --notes-file "${GITHUB_WORKSPACE}/notes.md" \
            $files
