name: PureVox CI

on:
  # Only tag pushes (v...) run CI: branch pushes must stay cheap so everyday
  # commits never trigger a full build. Manually trigger via workflow_dispatch
  # to verify the branch without tagging.
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal packages: deb (Ubuntu) + rpm (fedora). AppImage 由 deb/rpm 覆盖。
          - distro: ubuntu-22.04
            container: ubuntu:22.04
            # Qt6 C++ runtime + dev (libqt6widgets6 etc); pipewire/alsa dev for bridges.
            sysdeps: "build-essential cmake ninja-build pkg-config libpipewire-0.3-dev libasound2-dev qt6-base-dev libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev imagemagick wget git file"
            pkg_deb: true
          - distro: fedora
            container: fedora:latest
            sysdeps: "gcc-c++ cmake ninja-build pkgconf-pkg-config pipewire-devel alsa-lib-devel qt6-qtbase-devel rpm-build python3-pillow"
            pkg_rpm: true
    container:
      image: ${{ matrix.container }}
    steps:
      # Install system dependencies BEFORE checkout: containers have no git.
      - name: Install system dependencies
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ${{ matrix.sysdeps }}
          else
            dnf install -y --quiet ${{ matrix.sysdeps }}
          fi

      - uses: actions/checkout@v5

      - name: Set build timestamp (tag v* -> tag version; else now)
        id: ts
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            stamp="${GITHUB_REF_NAME#v}"
            stamp="${stamp//./-}"
            echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          else
            echo "stamp=$(date +'%Y-%m-%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build Qt C++ binary
        run: cmake --build build -j4

      - name: Smoke test (offscreen launch loads engine)
        run: |
          test -x build/purevox
          LD_LIBRARY_PATH="$PWD/packages/onnxruntime-linux-x64-1.11.1/lib" \
            QT_QPA_PLATFORM=offscreen timeout 5 ./build/purevox --selftest

      - name: Package deb (Ubuntu)
        if: matrix.pkg_deb
        run: |
          bash pack_deb_cpp.sh
          ls -lh dist/PureVox-Linux-x64-*.deb

      - name: Upload deb artifact
        if: matrix.pkg_deb
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Linux-x64-${{ steps.ts.outputs.stamp }}-release-deb
          path: dist/PureVox-Linux-x64-*.deb
          if-no-files-found: error

      - name: Package rpm (Fedora)
        if: matrix.pkg_rpm
        run: |
          bash pack_rpm_cpp.sh
          ls -lh dist/PureVox-Linux-x64-*.rpm

      - name: Upload rpm artifact
        if: matrix.pkg_rpm
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Linux-x64-${{ steps.ts.outputs.stamp }}-release-rpm
          path: dist/PureVox-Linux-x64-*.rpm
          if-no-files-found: error

  windows:
    name: Windows (Qt C++ bundle)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set build timestamp (tag v* -> tag version; else now)
        id: ts
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $stamp = $env:GITHUB_REF_NAME.Substring(1) -replace '\.', '-'
          } else {
            $stamp = Get-Date -Format 'yyyy-MM-dd-HHmm'
          }
          "stamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up mingw-w64 gcc
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Install Qt6 for mingw
        shell: bash
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.5.3 win64_mingw -O "${{ runner.temp }}/qt"
          echo "QT_DIR=${{ runner.temp }}/qt/6.5.3/mingw_64" >> "$GITHUB_ENV"

      - name: Configure CMake
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;$env:PATH"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_DIR" `
            -G Ninja

      - name: Build Qt C++ binary
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;$env:PATH"
          cmake --build build -j4

      - name: Smoke test (offscreen launch)
        shell: pwsh
        run: |
          test -f build/purevox.exe
          Write-Host "purevox.exe built OK"

      - name: Bundle Windows runtime (Qt DLLs + onnxruntime + models)
        shell: pwsh
        run: |
          $bin = "${{ runner.temp }}/bundle"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item "build/purevox.exe" $bin
          Copy-Item "packages/onnxruntime-win-x64-1.11.1/lib/onnxruntime.dll" $bin
          Copy-Item "aec9_ep0544.onnx","tse15_stream_ep_0673.onnx","v9_fft2048_band256_epoch_261.onnx" $bin
          # windeployqt copies the required Qt DLLs next to the exe
          & "$env:QT_DIR\bin\windeployqt.exe" --no-translations "$bin\purevox.exe"
          if (-not (Test-Path "$bin\purevox.exe")) { throw "bundle missing exe" }
          Write-Host "bundle ready"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Windows-x64-${{ steps.ts.outputs.stamp }}-release
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set build timestamp (tag v* -> tag version; else now)
        id: ts
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            stamp="${GITHUB_REF_NAME#v}"
            stamp="${stamp//./-}"
            echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          else
            echo "stamp=$(date +'%Y-%m-%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install SDK platform 34 + NDK r27
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "ndk;27.0.12077973" "build-tools;34.0.0"

      - name: Download Opus source (android/opus-src is gitignored)
        run: |
          mkdir -p android/opus-src
          wget -q -O /tmp/opus.zip https://github.com/xiph/opus/archive/refs/tags/v1.5.2.zip
          unzip -q /tmp/opus.zip -d /tmp
          mv /tmp/opus-1.5.2/* android/opus-src/
          test -f android/opus-src/CMakeLists.txt

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK with timestamp (tag v* -> tag version; else now)
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            stamp="${GITHUB_REF_NAME#v}"
            stamp="${stamp//./-}"
          else
            stamp=$(date +'%Y-%m-%d-%H%M')
          fi
          mv android/app/build/outputs/apk/debug/app-debug.apk "PureVox-Android-arm64-$stamp-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PureVox-Android-arm64-${{ steps.ts.outputs.stamp }}-debug-apk
          path: PureVox-Android-arm64-*.apk
          if-no-files-found: error

  release:
    name: Release (tag -> attach all artifacts + diff vs previous)
    runs-on: ubuntu-latest
    needs: [linux, windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: artifacts

      - name: Pack Windows bundle directory into a zip
        shell: bash
        run: |
          cd artifacts
          shopt -s nullglob
          for d in PureVox-Windows-*-release/; do
            zip -q -9 -r "${d%/}.zip" "$d"
            rm -rf "$d"
          done

      # Auto-generate a "changes vs previous release" description by diffing
      # the git log between the previous release tag and this tag.
      - name: Generate release notes (diff vs previous release)
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 50 --json tagName -q '.[].tagName' | grep -v "^${TAG}$" | head -1 || true)"
          BODY="自动发布：tag ${TAG} 对应的 Qt C++ 构建产物（deb / rpm / Windows / Android APK）。"
          if [ -n "${PREV}" ]; then
            BODY="${BODY}\n\n## 与上个版本（${PREV}）的变更\n"
            # 提交摘要（提交信息，去除 merge 噪音）
            BODY="${BODY}\n\`\`\`\n"
            LOG="$(git log --oneline --no-merges "${PREV}".."${TAG}" 2>/dev/null || true)"
            if [ -z "${LOG}" ]; then
              BODY="${BODY}（无直接提交记录）"
            else
              BODY="${BODY}${LOG}"
            fi
            BODY="${BODY}\n\`\`\`\n"
            # 变更文件统计
            STAT="$(git diff --stat "${PREV}".."${TAG}" 2>/dev/null | tail -1 || true)"
            BODY="${BODY}\n文件变更统计：${STAT}"
          else
            BODY="${BODY}\n\n（这是首个 tag，无前版本对比）"
          fi
          BODY="${BODY}\n\n---\n\n自动生成：提交摘要 + 变更统计。"
          printf '%s' "$BODY" > notes.md
          echo "BODY<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s' "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          files=$(find . -type f | sort | tr '\n' ' ')
          gh release create -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            --title "PureVox ${GITHUB_REF_NAME}" \
            --notes-file ../notes.md \
            $files
