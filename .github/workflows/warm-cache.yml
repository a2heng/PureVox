# 缓存预热 —— **全仓库唯一的缓存写入者**，且**只手动触发**（workflow_dispatch）。
# tests.yml / release.yml 一律 restore-only。GitHub 缓存按触发 ref 分域，让各工作流
# 各写各的只会堆出没人回读的重复条目（tag 上写入的尤其如此）；集中到一处写。
# **覆盖语义**：GitHub 缓存 key 不可变（同键已存在的 save 会被拒），所以每次保存前先按 key
# 删掉旧条目（`gh api DELETE .../actions/caches?key=`），再 save —— 这才真正「新覆盖旧」。
# 依赖升级（Cargo.lock / Cargo.toml / versions.env 变更）后，从默认分支手动 dispatch
# 一次本工作流暖桶，之后的分支/ tag 都能回读。
# warm 用「冷构建 target」（不恢复 target 缓存）→ 保存的快照始终干净、无历史增量垃圾。
name: 缓存预热（手动）

on:
  workflow_dispatch:

env:
  # linuxdeploy / appimagetool 需要 FUSE；CI 容器里没有，用解包运行模式。
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  warm:
    name: 预热 · ${{ matrix.os }}（唯一缓存写入者）
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write # 删旧缓存（GitHub 缓存 key 不可变，覆盖 = 先删再存）
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Load versions + cache keys (versions.env 是唯一来源)
        run: |
          $vars = @{}
          Get-Content tools/automation/versions.env | Where-Object { $_ -match '^(\w+)=(.*)$' } | ForEach-Object {
            $vars[$Matches[1]] = $Matches[2]
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $lock = "${{ hashFiles('src-tauri/Cargo.lock') }}"
          "CARGO_CACHE_KEY=purevox-$env:RUNNER_OS-cargo-$($vars['CACHE_GEN'])-$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TARGET_DEBUG_KEY=purevox-$env:RUNNER_OS-target-dbg-$($vars['CACHE_GEN'])-$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TARGET_RELEASE_KEY=purevox-$env:RUNNER_OS-target-rel-$($vars['CACHE_GEN'])-$($vars['TCLI_VER'])-$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_CLI_KEY=purevox-$env:RUNNER_OS-tauri-cli-$($vars['TCLI_VER'])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Tauri wry 运行时 (WebKitGTK 4.1) + cpal (ALSA) + 打 rpm 需要 rpmbuild。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev libgtk-3-dev libasound2-dev \
            libopus0 pkg-config file rpm

      - name: Install Rust toolchain (rustfmt + clippy)
        run: |
          rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$env:RUST_TOOLCHAIN"

      - name: Restore cargo registry (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: |
            purevox-${{ runner.os }}-cargo-${{ env.CACHE_GEN }}-

      - name: Restore cargo-tauri binary (restore-only)
        id: tcli
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}

      - name: Install tauri-cli (仅缓存未命中时编译，版本钉死)
        if: steps.tcli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "$env:TCLI_VER" --locked

      # 冷构建 debug（不恢复 target 缓存）：clippy/build/test 覆盖 target/debug 全部工件。
      - name: Warm debug (clippy + build + test)
        run: |
          ./tools/automation/check.ps1 -Gate clippy
          ./tools/automation/check.ps1 -Gate build
          ./tools/automation/check.ps1 -Gate test

      # 冷构建 release + 打安装器：顺带预热 WiX/NSIS（Windows）与 onnxruntime 下载，
      # 并顺手验证 bundle 配置（模型资源）在该提交上仍可打包。
      - name: Warm release + installers
        working-directory: src-tauri
        run: cargo tauri build

      - name: Drop stale caches（同键先删，保证新缓存覆盖旧的）
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 缓存 key 不可变：同键已存在时 save 会被拒（旧的永远留着）。先按 key 删掉旧的。
          foreach ($k in @($env:CARGO_CACHE_KEY, $env:TARGET_DEBUG_KEY, $env:TARGET_RELEASE_KEY, $env:TAURI_CLI_KEY)) {
            if (-not $k) { continue }
            $n = gh api --method DELETE "repos/${{ github.repository }}/actions/caches?key=$k" 2>$null
            Write-Host "drop $k -> $n"
          }

      - name: Save cargo registry
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}

      - name: Save target/debug
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: src-tauri/target/debug
          key: ${{ env.TARGET_DEBUG_KEY }}

      - name: Save target/release
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: src-tauri/target/release
          key: ${{ env.TARGET_RELEASE_KEY }}

      - name: Save cargo-tauri binary
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}
