<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureVox</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; padding: 2rem; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <h1>PureVox — Tauri 3 hello world</h1>
    <form id="form">
      <input id="name" placeholder="输入名字" />
      <button>Greet</button>
    </form>
    <p id="message"></p>
    <script>
      const { invoke } = window.__TAURI__.core
      document.querySelector('#form').addEventListener('submit', async (e) => {
        e.preventDefault()
        const name = document.querySelector('#name').value
        document.querySelector('#message').textContent = await invoke('greet', { name })
      })
    </script>
  </body>
</html>
