# 测试（门禁）—— **只测试，不打包**，且**只手动触发**（Actions → 测试 → Run workflow）。
# 分支推送 / PR **不触发**：日常提交零成本，要验证某分支手动 dispatch 一次即可。
# 打包与发版见 release.yml（tag `v*` 触发，也可手动）。
# 纪律（沿袭旧版）：
#   - 缓存全部 restore-only，唯一写入者是 warm-cache.yml（也手动）；
#   - 键与版本的唯一来源是 tools/automation/versions.env（本文件只组合，不硬编码版本）；
#   - 门禁实现只有一处 tools/automation/check.ps1（跨平台 PowerShell，本机与 CI 同一份）；
#   - legacy-v*/ 快照不参与 CI（AGENTS.md 维护准则 3）。
name: 测试（只跑门禁，手动触发）

on:
  workflow_dispatch:

jobs:
  rust:
    name: 测试 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Load versions + cache keys (versions.env 是唯一来源)
        run: |
          $vars = @{}
          Get-Content tools/automation/versions.env | Where-Object { $_ -match '^(\w+)=(.*)$' } | ForEach-Object {
            $vars[$Matches[1]] = $Matches[2]
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $lock = "${{ hashFiles('src-tauri/Cargo.lock') }}"
          "CARGO_CACHE_KEY=purevox-$env:RUNNER_OS-cargo-$($vars['CACHE_GEN'])-$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TARGET_DEBUG_KEY=purevox-$env:RUNNER_OS-target-dbg-$($vars['CACHE_GEN'])-$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # cpal 在 Linux 上要 ALSA 开发头（pkg-config 名字 `alsa`）；WebKitGTK 4.1 是 Tauri wry 运行时必需。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev libgtk-3-dev libasound2-dev \
            libopus0 pkg-config file

      - name: Install Rust toolchain (rustfmt + clippy)
        run: |
          rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$env:RUST_TOOLCHAIN"
          rustc --version

      - name: Restore cargo registry (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: |
            purevox-${{ runner.os }}-cargo-${{ env.CACHE_GEN }}-

      - name: Restore target/debug (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: src-tauri/target/debug
          key: ${{ env.TARGET_DEBUG_KEY }}
          restore-keys: |
            purevox-${{ runner.os }}-target-dbg-${{ env.CACHE_GEN }}-

      - name: "Gate · fmt"
        run: ./tools/automation/check.ps1 -Gate fmt

      - name: "Gate · clippy"
        run: ./tools/automation/check.ps1 -Gate clippy

      - name: "Gate · build"
        run: ./tools/automation/check.ps1 -Gate build

      - name: "Gate · test"
        run: ./tools/automation/check.ps1 -Gate test

  ui:
    name: 界面检查（tsc + i18n）
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Load versions (versions.env 是唯一来源)
        run: |
          Get-Content tools/automation/versions.env | Where-Object { $_ -match '^(\w+)=(.*)$' } | ForEach-Object {
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      # 本仓库无 package.json，不设 setup-node 的 cache（缓存只由 warm-cache.yml 写）。
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}

      - name: Install TypeScript (版本钉死在 versions.env)
        run: npm install -g "typescript@$env:TS_VER"

      - name: "Gate · ui (tsc + i18n_lint)"
        run: ./tools/automation/check.ps1 -Gate ui
