<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureVox</title>
    <link rel="stylesheet" href="debug.css" />
  </head>
  <body>
    <header id="topbar">
      <span class="brand">PureVox</span>
      <button id="btn-refresh" type="button">刷新设备</button>
      <button id="btn-devtools" type="button">开发者工具</button>
      <button id="btn-debug" type="button">调试面板</button>
      <span id="plan-status" class="mono"></span>
      <span id="rec-status" class="mono"></span>
      <span id="calib-status" class="mono"></span>
    </header>

    <main id="columns">
      <!-- 音频列：由 columns.js 渲染（默认一列，可增加；每列两端固定为输入/输出） -->
      <div id="audio-columns"></div>

      <!-- 调试列：最后一列，迁移期常驻 -->
      <section id="debug" class="column debug">
        <h2>调试 <span id="dbg-status" class="mono"></span></h2>

        <section>
          <h3>应用</h3>
          <table class="kv">
            <tr><th>版本</th><td id="app-version"></td><th>PID</th><td id="app-pid"></td></tr>
            <tr><th>运行时长</th><td id="app-uptime"></td><th>快照时间</th><td id="app-ts"></td></tr>
            <tr><th>调试接口</th><td id="app-http" colspan="3"></td></tr>
          </table>
        </section>

        <section>
          <h3>CPU / 内存 <span id="sys-sampled" class="sub"></span></h3>
          <table class="kv">
            <tr><th>CPU 系统</th><td id="cpu-system"></td><th>CPU 本进程</th><td id="cpu-process"></td></tr>
            <tr><th>逻辑核数</th><td id="cpu-cores"></td><th></th><td></td></tr>
            <tr><th>内存 系统已用</th><td id="mem-used"></td><th>内存 系统可用</th><td id="mem-avail"></td></tr>
            <tr><th>本进程 工作集</th><td id="mem-ws"></td><th>本进程 私有字节</th><td id="mem-private"></td></tr>
          </table>
          <p class="note">本进程不含 WebView2 子进程（界面渲染在 msedgewebview2.exe 中）。</p>
        </section>

        <section>
          <h3>GPU</h3>
          <div id="gpu-state" class="state"></div>
          <table class="grid" id="gpu-table">
            <colgroup><col class="c-name" /><col class="c-num" /><col class="c-num" /><col class="c-mem" /><col class="c-num" /></colgroup>
            <thead><tr><th>适配器</th><th>整卡占用</th><th>本进程占用</th><th>显存已用 / 总量</th><th>本进程显存</th></tr></thead>
            <tbody></tbody>
          </table>
        </section>

        <section>
          <h3>音频</h3>
          <table class="kv">
            <tr><th>引擎</th><td id="audio-engine" colspan="3"></td></tr>
            <tr><th>参考录制</th><td id="audio-recorder" colspan="3"></td></tr>
            <tr><th>延时校准</th><td id="audio-calib" colspan="3"></td></tr>
          </table>
          <div id="audio-streams"></div>
        </section>
      </section>
    </main>

    <script src="jsdebug.js"></script>
    <script src="columns.js"></script>
    <script src="debug.js"></script>
  </body>
</html>
