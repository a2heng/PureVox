<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureVox</title>
    <link rel="stylesheet" href="debug.css" />
  </head>
  <body>
    <main id="app">
      <p class="placeholder">PureVox 主界面（迁移中，尚未实现）</p>
    </main>

    <!-- 调试面板：迁移期常驻，默认展开，可折叠不可移除（AGENTS.md 1.1） -->
    <details id="debug" open>
      <summary>调试面板 <span id="dbg-status" class="mono"></span></summary>

      <section>
        <h2>应用</h2>
        <table class="kv">
          <tr><th>版本</th><td id="app-version"></td><th>PID</th><td id="app-pid"></td></tr>
          <tr><th>运行时长</th><td id="app-uptime"></td><th>快照时间</th><td id="app-ts"></td></tr>
          <tr><th>调试接口</th><td id="app-http" colspan="3"></td></tr>
        </table>
      </section>

      <section>
        <h2>CPU / 内存 <span id="sys-sampled" class="sub"></span></h2>
        <table class="kv">
          <tr><th>CPU 系统</th><td id="cpu-system"></td><th>CPU 本进程</th><td id="cpu-process"></td></tr>
          <tr><th>逻辑核数</th><td id="cpu-cores"></td><th></th><td></td></tr>
          <tr><th>内存 系统已用</th><td id="mem-used"></td><th>内存 系统可用</th><td id="mem-avail"></td></tr>
          <tr><th>本进程 工作集</th><td id="mem-ws"></td><th>本进程 私有字节</th><td id="mem-private"></td></tr>
        </table>
        <p class="note">本进程不含 WebView2 子进程（界面渲染在 msedgewebview2.exe 中）。</p>
      </section>

      <section>
        <h2>GPU</h2>
        <div id="gpu-state" class="state"></div>
        <table class="grid" id="gpu-table">
          <colgroup><col class="c-name" /><col class="c-num" /><col class="c-num" /><col class="c-mem" /><col class="c-num" /></colgroup>
          <thead><tr><th>适配器</th><th>整卡占用</th><th>本进程占用</th><th>显存已用 / 总量</th><th>本进程显存</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>

      <section>
        <h2>音频</h2>
        <table class="kv">
          <tr><th>引擎</th><td id="audio-engine" colspan="3"></td></tr>
        </table>
        <div id="audio-streams"></div>
      </section>

      <section>
        <h2>设备 <button id="dev-refresh" type="button">刷新</button> <span id="dev-meta" class="sub"></span></h2>
        <div id="dev-state" class="state"></div>
        <div id="dev-action" class="state"></div>
        <table class="grid" id="dev-table">
          <colgroup><col class="c-dir" /><col class="c-def" /><col class="c-name" /><col class="c-host" /><col class="c-fmt" /><col class="c-type" /><col class="c-act" /></colgroup>
          <thead><tr><th>方向</th><th>默认</th><th>名称</th><th>接口</th><th>原生格式</th><th>类型 / 总线</th><th>采集 / 播放测试</th></tr></thead>
          <tbody></tbody>
        </table>
        <ul id="dev-errors" class="errors"></ul>
      </section>
    </details>

    <script src="debug.js"></script>
  </body>
</html>
